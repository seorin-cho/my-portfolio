  # About
  about:
    enable: true
    title: "About Me"
    image: ""
    content: |-
      I am interested in web development because I enjoy seeing changes to my code and settings appear on a working website. Building this portfolio has made me curious about how page structure, visual design, and deployment work together.
      I use Hugo to organize my site, Git and GitHub to track changes, and GitHub Actions and GitHub Pages to build and deploy it automatically. I also use browser developer tools to check how CSS, JavaScript, and images load.

      My next goal is to learn the fundamentals of HTML and CSS so I can customize the theme myself. I plan to complete my portfolio content, test the mobile layout and keyboard navigation, and improve the issues I find.
    skills:
      enable: true
      title: "Tools I am learning and using:"
      items:
        - "Hugo"
        - "Git"
        - "GitHub"
        - "GitHub Actions"
        - "GitHub Pages"
        - "Browser Developer Tools"

