  # projects
  projects:
    enable: true
    title: "My Activities"
    items:
      - title: "Personal Portfolio Website"
        content: "Period: November 2026–Present. Status: In progress. My goal is to publish a portfolio that introduces me and my learning activities, and to learn how changes are tracked, automatically built, and deployed. An individual coursework project using Hugo and GitHub Pages. I edited the theme configuration and introduction, corrected GitHub links, removed unused social links, and tested deployment and website behavior with AI guidance. I first configured the theme, then deployed the site, checked its pages and links, and improved the issues I found. I chose an existing Hugo theme so I could focus on learning configuration, version control, and deployment before building a layout from scratch. The current result is a publicly accessible portfolio website and its GitHub repository. The website presents my introduction and activity, while the repository contains the configuration, content, deployment workflow, and revision history. I learned that saving a local file does not update the published website; I need to commit and push the changes, check the deployment, and verify the live result. I still rely on the theme for layout, so my next step is to learn responsive CSS, improve one section myself, and test it at different screen widths."
        featured:
          name: "View Repository"
          link: "https://github.com/seorin-cho/my-portfolio"
